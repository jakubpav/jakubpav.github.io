<head>
    <meta charset="UTF-8">

    <title>Jakub Pavelka - Redirecting</title>
</head>

<body class="flicker">
    <header>
        <h2><a href="/">Jakub Pavelka</a></h2>
        <nav>
            <ul>
                <li><a href="/main/about-me/">About Me</a></li>
                <li><a href="https://rxresu.me/jakubpav/jakub-pavelka" target="_blank">CV</a></li>
            </ul>
        </nav>
        <script>
            let flicker = localStorage.getItem('flicker-store');
            let flickerSwitch = function () {
                let button = document.getElementById('stop-flicker-btn');
                if (flicker === 'started' || flicker === undefined || flicker === null) {
                    document.body.classList.remove('flicker');
                    flicker = 'stopped';
                    button.textContent = 'Start Effect';
                } else {
                    document.body.classList.add('flicker');
                    button.textContent = 'Stop Effect';
                    flicker = 'started';
                }
                localStorage.setItem('flicker-store', flicker);
            }
            document.body.addEventListener('dblclick', flickerSwitch);
            document.addEventListener('scroll', (event) => {
                document.body.classList.add('flicker');
                setTimeout(() => { document.body.classList.remove('flicker'); }, 1500);
            });
            if (flicker === 'started') {
                document.body.classList.add('flicker');
                document.getElementById('stop-flicker-btn').textContent = 'Stop Effect';
            } else {
                document.body.classList.remove('flicker');
                document.getElementById('stop-flicker-btn').textContent = 'Start Effect';
            }
        </script>
    </header>
    <main> 
<script>
    window.location.replace("/main/about-me/");
</script>
<noscript>
    <meta http-equiv="refresh" content="0; url=/main/about-me/">
    <p>If you are not redirected automatically, follow this <a href="/main/about-me/">link</a>.</p>
</noscript>
